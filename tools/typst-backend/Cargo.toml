[package]
name = "vtextedit-typst"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-only"
publish = false

[dependencies]
blake3 = "1"
comemo = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "=0.15.1"
typst-syntax = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "system-packages", "system-downloader", "datetime"] }
usvg = "=0.47.0"

[profile.dev]
debug = 0

[profile.release]
strip = true
