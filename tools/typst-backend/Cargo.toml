[package]
name = "vtextedit-typst"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-only"
publish = false
autobins = false

[lib]
name = "vtextedit_typst"
crate-type = ["cdylib"]

[dependencies]
blake3 = "1"
comemo = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
typst = "=0.15.1"
typst-syntax = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "system-packages", "system-downloader", "datetime"] }
usvg = "=0.47.0"

[profile.dev]
debug = 0
panic = "unwind"

[profile.release]
strip = true
panic = "unwind"
